services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: lexmon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexmon
      POSTGRES_USER: lexmon
      POSTGRES_PASSWORD: lexmon
    volumes:
      - lexmon-postgres-data:/var/lib/postgresql/data
    networks:
      - lexmon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexmon -d lexmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: lexmon-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://lexmon:lexmon@postgres:5432/lexmon?schema=public
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      OAUTH_CALLBACK_BASE_URL: http://localhost:8080/api
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID:-}
      OAUTH_42_CLIENT_SECRET: ${OAUTH_42_CLIENT_SECRET:-}
    depends_on:
      - postgres
    volumes:
      - uploads-data:/app/uploads
    expose:
      - "3000"
    networks:
      - lexmon

  frontend:
    build:
      context: ./frontend
    container_name: lexmon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - lexmon

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: lexmon-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lexmon

networks:
  lexmon:
    driver: bridge

volumes:
  lexmon-postgres-data:
  uploads-data:
