services:
  vault:
    image: hashicorp/vault:1.13.3
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'lexmon_root_token'
      VAULT_LISTEN_ADDRESS: '0.0.0.0:8200'
    cap_add: IPC_LOCK
    networks:
      - lexmon
  
  vault-init:
    image: hashicorp/vault:1.13.3
    container_name: vault-init
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: 'http://vault:8200'
      VAULT_TOKEN: 'lexmon_root_token'
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB} 
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      OAUTH_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      OAUTH_42_CLIENT_SECRET: ${OAUTH_42_CLIENT_SECRET}
    volumes:
      - ./vault/init.sh:/init.sh
    entrypoint: /bin/sh -c "/init.sh"
    networks:
      - lexmon

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: lexmon-postgres
    restart: unless-stopped
    depends_on:
      vault-init: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_USER:  ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lexmon-postgres-data:/var/lib/postgresql/data
    networks:
      - lexmon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexmon -d lexmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: lexmon-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://localhost:8080
      FRONTEND_URL: https://localhost:8080
      OAUTH_CALLBACK_BASE_URL: https://localhost:8080/api
      VAULT_ADDR: 'http://vault:8200'
      VAULT_TOKEN: 'lexmon_root_token'
    depends_on: 
      - postgres:
          condition: service_healthy
      - vault-init:
          condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
    expose:
      - "3000"
    networks:
      - lexmon

  frontend:
    build:
      context: ./frontend
    container_name: lexmon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - lexmon

  # add modsecurity WAF in nginx container
  nginx:
    image: owasp/modsecurity-crs:nginx
    container_name: lexmon-nginx
    restart: unless-stopped
    ports:
      - "443:8443"
    environment:
      - PARANOIA=2
      - SERVER_NAME=localhost
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lexmon

networks:
  lexmon:
    driver: bridge

volumes:
  lexmon-postgres-data:
  uploads-data:
