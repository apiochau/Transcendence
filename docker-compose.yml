services:
  vault:
    image: hashicorp/version:1.13.3
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: 'lexmon_root_token'
      VAULT_LISTEN_ADDRESS: '0.0.0.0:8200'
    cap_add: IPC_LOCK
    networks:
      - lexmon
  
  vault-init:
    image: hashicorp/version:1.13.3
    container_name: vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: 'http://vault:8200'
      VAULT_TOKEN: 'lexmon_root_token'
    volumes:
      - ./vault/init.sh:/init.sh
    entrypoint: /bin/sh -c "./init.sh"
    networks:
      - lexmon

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: lexmon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexmon
      POSTGRES_USER: lexmon
      POSTGRES_PASSWORD: lexmon
    volumes:
      - lexmon-postgres-data:/var/lib/postgresql/data
    networks:
      - lexmon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexmon -d lexmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: lexmon-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://lexmon:lexmon@postgres:5432/lexmon?schema=public
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      OAUTH_CALLBACK_BASE_URL: http://localhost:8080/api
    depends_on:
      - postgres
      # need to add vault dependency, with condition
      - vault-init
    volumes:
      - uploads-data:/app/uploads
    expose:
      - "3000"
    networks:
      - lexmon

  frontend:
    build:
      context: ./frontend
    container_name: lexmon-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - lexmon

  # add modsecurity service in nginx container
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: lexmon-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lexmon

networks:
  lexmon:
    driver: bridge

volumes:
  lexmon-postgres-data:
  uploads-data:
